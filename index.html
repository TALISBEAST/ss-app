<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Script Studio">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Script Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: Family Shield HQ house style. Sticky pill nav over a warm-gray canvas, white 20px cards with hairlines, one teal accent, wallet-stacked product cards; a bottom tab bar on phones. */
:root {
  --bg: #f6f6f3; --surface: #ffffff; --surface-2: #fafaf8; --hover: #f0f0ec; --pill-active: #ffffff;
  --line: #e9e9e5; --line-2: #f0f0ec;
  --ink: #1c1c1e; --ink-2: #3a3a3c; --muted: #6e6e73; --faint: #a1a1a6;
  --teal: #0f6b73; --teal-2: #0c5a61; --teal-soft: #e6f1f1; --accent-fill: #0f6b73; --accent-fill-hover: #0c5a61; --on-teal: #ffffff;
  --gold: #c39a52; --gold-ink: #8a6526; --gold-soft: #f8efdf;
  --red: #c2412d; --red-soft: #fbe8e4; --green: #2f8a57; --green-soft: #e3f2e9; --amber: #9a6214; --amber-soft: #fbf0da;
  --fe-a: #8e3f52; --fe-b: #c7775f; --mp-a: #0c5a61; --mp-b: #2b9a8c;
  --shadow: 0 1px 2px rgba(0,0,0,.03), 0 10px 30px -16px rgba(0,0,0,.10);
  --shadow-pop: 0 1px 2px rgba(0,0,0,.05), 0 4px 12px -4px rgba(0,0,0,.08);
  --shadow-card: 0 18px 40px -18px rgba(20,30,30,.45);
  --r: 20px;
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0b0c; --surface: #141416; --surface-2: #19191b; --hover: #1e1e21; --pill-active: #2b2b2f; --line: #26262a; --line-2: #1d1d20;
    --ink: #f5f5f7; --ink-2: #c8c8cd; --muted: #8d8d93; --faint: #5d5d63;
    --teal: #5cc2c4; --teal-2: #7fd2d3; --teal-soft: #142727; --accent-fill: #1e7d83; --accent-fill-hover: #23909a; --on-teal: #ffffff;
    --gold: #d8b578; --gold-ink: #e2c38e; --gold-soft: #252016;
    --red: #f2806d; --red-soft: #2a1714; --green: #5fc48a; --green-soft: #11241a; --amber: #e7b25a; --amber-soft: #292112;
    --fe-a: #6f2f40; --fe-b: #a85d4a; --mp-a: #0a4a50; --mp-b: #1f7d72;
    --shadow: none; --shadow-pop: 0 1px 2px rgba(0,0,0,.4); --shadow-card: 0 18px 40px -18px rgba(0,0,0,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0b0c; --surface: #141416; --surface-2: #19191b; --hover: #1e1e21; --pill-active: #2b2b2f; --line: #26262a; --line-2: #1d1d20;
  --ink: #f5f5f7; --ink-2: #c8c8cd; --muted: #8d8d93; --faint: #5d5d63;
  --teal: #5cc2c4; --teal-2: #7fd2d3; --teal-soft: #142727; --accent-fill: #1e7d83; --accent-fill-hover: #23909a; --on-teal: #ffffff;
  --gold: #d8b578; --gold-ink: #e2c38e; --gold-soft: #252016;
  --red: #f2806d; --red-soft: #2a1714; --green: #5fc48a; --green-soft: #11241a; --amber: #e7b25a; --amber-soft: #292112;
  --fe-a: #6f2f40; --fe-b: #a85d4a; --mp-a: #0a4a50; --mp-b: #1f7d72;
  --shadow: none; --shadow-pop: 0 1px 2px rgba(0,0,0,.4); --shadow-card: 0 18px 40px -18px rgba(0,0,0,.8);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; letter-spacing: -0.02em; font-weight: 600; }
p { margin: 0; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.num, .tab { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* ===== Nav ===== */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 41; background: var(--bg); }
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter: saturate(1.8) blur(18px); -webkit-backdrop-filter: saturate(1.8) blur(18px); border-bottom: 1px solid var(--line-2); }
.nav-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 12px; height: 68px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.logo { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(145deg, #e2c38c, #b88a46); color: #fff; border: 0; flex: none; }
.logo svg { width: 20px; height: 20px; stroke-width: 2.1; }
.brand { font-weight: 700; font-size: 16px; letter-spacing: -0.02em; white-space: nowrap; }
.brand small { display: block; font-size: 11.5px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-top: -2px; }
.pills { display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--hover); margin-left: 10px; }
.pill-btn { height: 36px; padding: 0 15px; border-radius: 999px; border: 0; background: transparent; color: var(--muted); font-weight: 500; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: color .15s, background .15s; }
.pill-btn:hover { color: var(--ink); }
.pill-btn[aria-current="page"] { background: var(--pill-active); color: var(--ink); font-weight: 600; box-shadow: var(--shadow-pop); }
.nav-sp { flex: 1; }
.sync { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--hover); color: var(--muted); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.sync .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.sync[data-s="synced"] .dot { background: var(--green); }
.sync[data-s="connecting"] .dot { background: var(--amber); }
.sync[data-s="offline"] .dot { background: var(--red); }
.me { display: flex; align-items: center; gap: 9px; height: 40px; padding: 0 12px 0 3px; border-radius: 999px; background: var(--hover); font-weight: 600; font-size: 14px; flex: none; }
.me img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; display: block; }

.tabbar { display: none; }

/* ===== Page ===== */
.page { max-width: 1180px; margin: 0 auto; padding-top: 32px; padding-bottom: 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 24px; }
@media (min-width: 761px) { .page, .nav-in { padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); } }
.greet .date { font-size: 14px; color: var(--muted); font-weight: 500; }
.greet h1 { font-size: 38px; line-height: 1.1; margin-top: 6px; letter-spacing: -0.035em; }
.greet p { color: var(--muted); margin-top: 8px; font-size: 15px; }
.head h1 { font-size: 30px; letter-spacing: -0.03em; line-height: 1.15; }
.head p { color: var(--muted); margin-top: 6px; font-size: 15px; max-width: 62ch; }
.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.sec-title h2 { font-size: 19px; letter-spacing: -0.025em; }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); border: 1px solid var(--line-2); }
.pad { padding: 22px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--hover); color: var(--ink); font-weight: 600; font-size: 14px; white-space: nowrap; transition: background .15s, transform .06s; }
.btn:hover { background: color-mix(in srgb, var(--hover) 70%, var(--line)); }
.btn:active { transform: scale(0.98); }
.btn.teal { background: var(--accent-fill); color: var(--on-teal); }
.btn.teal:hover { background: var(--accent-fill-hover); }
.btn.sm { height: 34px; padding: 0 14px; font-size: 13px; }
.btn.lg { height: 48px; padding: 0 24px; font-size: 15px; }
.btn[disabled] { opacity: .45; cursor: default; }
.link { border: 0; background: none; color: var(--teal); font-weight: 600; padding: 4px 2px; display: inline-flex; align-items: center; gap: 4px; }

/* ===== Home ===== */
.home-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.wallet { display: flex; flex-direction: column; }
.wcard { position: relative; border: 0; text-align: left; color: #fff; border-radius: 24px; padding: 22px 24px 20px; min-height: 178px; box-shadow: var(--shadow-card); display: flex; flex-direction: column; gap: 10px; overflow: hidden; transition: transform .2s; }
.wcard + .wcard { margin-top: -78px; }
.wcard:hover { transform: translateY(-3px); }
.wcard.fe { background: linear-gradient(135deg, var(--fe-a), var(--fe-b)); }
.wcard.mp { background: linear-gradient(135deg, var(--mp-a), var(--mp-b)); }
.wcard::after { content: ""; position: absolute; right: -60px; top: -70px; width: 220px; height: 220px; border-radius: 50%; border: 26px solid rgba(255,255,255,.08); pointer-events: none; }
.wcard .wtop { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.wcard .wname { font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }
.wcard .wchip { font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: rgba(255,255,255,.18); white-space: nowrap; }
.wcard .wpct { font-size: 40px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; margin-top: auto; }
.wcard .wpct small { font-size: 14px; font-weight: 500; letter-spacing: 0; opacity: .85; margin-left: 6px; }
.wcard .wbar { height: 6px; border-radius: 99px; background: rgba(255,255,255,.22); overflow: hidden; }
.wcard .wbar i { display: block; height: 100%; background: #fff; border-radius: 99px; }
.wcard .wmeta { font-size: 12.5px; opacity: .85; display: flex; justify-content: space-between; gap: 10px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; }
.stat { padding: 18px 20px; }
.stat + .stat { border-left: 1px solid var(--line-2); }
.stat b { display: block; font-size: 26px; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.resume { display: flex; align-items: center; gap: 14px; padding: 18px 20px; border-top: 1px solid var(--line-2); }
.resume .txt { flex: 1; min-width: 0; }
.resume .txt b { display: block; font-size: 14.5px; }
.resume .txt span { font-size: 13px; color: var(--muted); }
.tile { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--teal-soft); color: var(--teal); }
.tile.fe { background: color-mix(in srgb, var(--fe-b) 16%, var(--surface)); color: var(--fe-a); }
:root[data-theme="dark"] .tile.fe { color: #f0b7a6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tile.fe { color: #f0b7a6; } }
.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 14px; padding: 13px 18px; border: 0; background: none; text-align: left; width: 100%; }
.row + .row { border-top: 1px solid var(--line-2); }
.row:hover { background: var(--surface-2); }
.row .rt { flex: 1; min-width: 0; }
.row .rt b { display: block; font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .rt span { font-size: 12.5px; color: var(--muted); }
.row .chev { color: var(--faint); }
.list.card { overflow: hidden; }

/* ===== Scope bar ===== */
.scope { display: flex; flex-direction: column; gap: 12px; }
.scope-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--hover); max-width: 100%; }
.seg button { height: 34px; padding: 0 15px; border: 0; border-radius: 999px; background: none; color: var(--muted); font-weight: 600; font-size: 13.5px; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; }
.seg button[aria-pressed="true"] { background: var(--pill-active); color: var(--ink); box-shadow: var(--shadow-pop); }
.seg .pdot { width: 8px; height: 8px; border-radius: 50%; }
.pdot.fe { background: linear-gradient(135deg, var(--fe-a), var(--fe-b)); }
.pdot.mp { background: linear-gradient(135deg, var(--mp-a), var(--mp-b)); }
.scroller { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: -2px; max-width: 100%; }
.scroller::-webkit-scrollbar { display: none; }
.chip { height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-weight: 500; font-size: 13px; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; flex: none; }
.chip:hover { border-color: var(--faint); }
.chip[aria-pressed="true"] { background: var(--chip-dark, var(--ink)); color: var(--bg); border-color: transparent; font-weight: 600; }
.chip .cdot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); flex: none; }
.chip .cdot.learn { background: var(--amber); }
.chip .cdot.done { background: var(--green); }
.chip[disabled] { opacity: .5; cursor: default; }
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: none; padding: 10px 0 12px; color: var(--muted); font-weight: 600; font-size: 14px; white-space: nowrap; position: relative; display: inline-flex; gap: 7px; align-items: center; }
.tabs button .ct { font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: var(--hover); color: var(--muted); }
.tabs button[aria-current="true"] { color: var(--ink); }
.tabs button[aria-current="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); border-radius: 2px; }

/* ===== Browse ===== */
.browse { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 28px; align-items: start; }
.toc { position: sticky; top: calc(84px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 110px); overflow-y: auto; }
.toc .tl { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 0 10px 8px; }
.toc button { display: flex; align-items: center; gap: 10px; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 10px; color: var(--ink-2); font-size: 13.5px; font-weight: 500; }
.toc button:hover { background: var(--hover); }
.toc button .tn { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--hover); color: var(--muted); flex: none; }
.toc button .tn.learn { background: var(--amber-soft); color: var(--amber); }
.toc button .tn.done { background: var(--green-soft); color: var(--green); }
.jump { display: none; }
.shead { padding: 24px 26px; display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.shead h2 { font-size: 26px; letter-spacing: -0.03em; }
.goal { background: var(--teal-soft); color: var(--ink-2); border-radius: 14px; padding: 12px 14px; font-size: 14px; }
.goal b, .goal strong { color: var(--ink); }
.goal .gl { display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); margin-bottom: 3px; }
.shead .meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.shead .meta span { font-size: 13px; color: var(--muted); }
.switch { display: inline-flex; align-items: center; gap: 10px; border: 0; background: none; font-weight: 600; font-size: 13.5px; color: var(--ink-2); padding: 0; }
.switch .tr { width: 40px; height: 24px; border-radius: 99px; background: var(--line); position: relative; transition: background .15s; flex: none; }
.switch .tr::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
.switch[aria-pressed="true"] .tr { background: var(--accent-fill); }
.switch[aria-pressed="true"] .tr::after { transform: translateX(16px); }
.secs { display: flex; flex-direction: column; gap: 18px; }
.sec { scroll-margin-top: calc(90px + env(safe-area-inset-top, 0px)); overflow: hidden; }
.sec-h { display: flex; align-items: center; gap: 12px; padding: 18px 22px; border-bottom: 1px solid var(--line-2); }
.sec-h .sn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--teal-soft); color: var(--teal); font-weight: 700; font-size: 13px; flex: none; }
.sec-h h3 { font-size: 17px; flex: 1; min-width: 0; }
.sec-f { display: flex; align-items: center; gap: 10px; padding: 12px 22px; border-top: 1px solid var(--line-2); background: var(--surface-2); flex-wrap: wrap; }
.sec-f .sp { flex: 1; }
.state { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; background: var(--hover); color: var(--muted); }
.state.learn { background: var(--amber-soft); color: var(--amber); }
.state.done { background: var(--green-soft); color: var(--green); }
.tips { padding: 18px 22px; display: flex; flex-direction: column; gap: 8px; }
.tips h4 { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-ink); }
.tips ol, .tips ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; color: var(--ink-2); }
.tips .fn { font-size: 13px; color: var(--muted); }

/* script blocks */
.blocks { padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
.say { font-size: 15.5px; line-height: 1.62; color: var(--ink); max-width: 72ch; }
.say .if, .note .if { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--gold-ink); background: var(--gold-soft); padding: 1px 7px; border-radius: 6px; margin-right: 6px; vertical-align: 2px; }
.ph { background: var(--teal-soft); color: var(--teal); font-weight: 600; border-radius: 6px; padding: 0 5px; font-size: .94em; white-space: nowrap; }
.cust { align-self: flex-start; max-width: min(560px, 92%); background: var(--surface-2); border: 1px solid var(--line); border-radius: 16px 16px 16px 5px; padding: 9px 13px; }
.who { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-bottom: 2px; }
.cust p { color: var(--ink-2); font-size: 14.5px; }
.note { display: flex; gap: 10px; align-items: flex-start; background: var(--amber-soft); color: var(--ink-2); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; max-width: 72ch; }
.note svg { color: var(--amber); margin-top: 1px; width: 16px; height: 16px; }
.lbl { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.txt { color: var(--ink-2); }
.lst { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.lst > li { display: flex; gap: 10px; align-items: flex-start; }
.lst .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; background: var(--hover); color: var(--ink-2); flex: none; margin-top: 2px; }
.lst .dotm { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); flex: none; margin: 11px 9px 0; }
.lst > li > div { min-width: 0; flex: 1; }
.lst .sub { margin: 6px 0 0; padding-left: 16px; color: var(--ink-2); font-size: 13.5px; display: flex; flex-direction: column; gap: 4px; }
.branch { border-left: 2px solid var(--line); padding-left: 14px; display: flex; flex-direction: column; gap: 10px; margin: 2px 0; }
.bpill { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--gold-ink); background: var(--gold-soft); padding: 4px 10px 4px 8px; border-radius: 99px; }
.bpill svg { width: 14px; height: 14px; }
.bbody { display: flex; flex-direction: column; gap: 10px; }
.sms { align-self: flex-end; max-width: min(520px, 92%); background: var(--accent-fill); color: var(--on-teal); border-radius: 18px 18px 5px 18px; padding: 10px 14px; }
.sms .who { color: rgba(255,255,255,.75); }
.sms .ph { background: rgba(255,255,255,.2); color: #fff; }
.covered .say { cursor: pointer; }
.covered .say:not(.shown) { filter: blur(6px); user-select: none; }
.covered .say:not(.shown):hover { filter: blur(4px); }

/* ===== Study ===== */
.study { max-width: 760px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.meter { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); font-weight: 600; }
.meter .bar { flex: 1; }
.bar { height: 6px; border-radius: 99px; background: var(--hover); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--teal); transition: width .3s; }
.bar.green i { background: var(--green); }
.flash { padding: 0; overflow: hidden; }
.flash .ctx { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 16px 22px; border-bottom: 1px solid var(--line-2); font-size: 12.5px; color: var(--muted); font-weight: 600; }
.flash .ctx .state { margin-left: auto; }
.cue, .ans { padding: 22px; }
.cue .who, .ans .who { margin-bottom: 6px; }
.cue p { font-size: 17px; line-height: 1.55; color: var(--ink-2); }
.cue p.big { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); line-height: 1.3; }
.cue .prevline { font-size: 15px; color: var(--muted); }
.ans { border-top: 1px dashed var(--line); background: var(--surface-2); }
.ans .say { font-size: 18px; }
.ans .who { color: var(--teal); }
.reveal { width: 100%; border: 0; border-top: 1px solid var(--line-2); background: var(--surface-2); padding: 18px; font-weight: 600; color: var(--teal); display: flex; justify-content: center; align-items: center; gap: 8px; }
.reveal:hover { background: var(--hover); }
.kbd { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
.grades { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.grade { height: 54px; border-radius: 16px; border: 0; font-weight: 700; font-size: 14.5px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; }
.grade small { font-weight: 500; font-size: 11.5px; opacity: .8; }
.grade.g0 { background: var(--red-soft); color: var(--red); }
.grade.g1 { background: var(--amber-soft); color: var(--amber); }
.grade.g2 { background: var(--accent-fill); color: var(--on-teal); }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px 16px; font-size: 14.5px; line-height: 1.5; color: var(--ink); }
.opt:hover:not([disabled]) { border-color: var(--teal); }
.opt .ok { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--hover); color: var(--muted); flex: none; }
.opt.right { border-color: var(--green); background: var(--green-soft); }
.opt.right .ok { background: var(--green); color: #fff; }
.opt.wrong { border-color: var(--red); background: var(--red-soft); }
.opt.wrong .ok { background: var(--red); color: #fff; }
.opt[disabled] { cursor: default; }
.typebox { width: 100%; min-height: 120px; resize: vertical; border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; background: var(--surface); font-size: 15.5px; line-height: 1.55; }
.typebox:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }
.diff { font-size: 16px; line-height: 1.7; }
.diff .hit { color: var(--green); }
.diff .miss { color: var(--red); text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 4px; }
.score { display: flex; align-items: center; gap: 14px; }
.score b { font-size: 30px; letter-spacing: -0.03em; }
.actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.done-card { padding: 34px 26px; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.done-card h2 { font-size: 26px; }
.tally { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.tally span { font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 99px; }
.empty { padding: 34px 26px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.empty h3 { color: var(--ink); font-size: 18px; }

/* ===== Progress ===== */
.prog-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.pscript .ph-h { display: flex; align-items: center; gap: 14px; padding: 18px 20px; border-bottom: 1px solid var(--line-2); }
.pscript .ph-h .t { flex: 1; min-width: 0; }
.pscript .ph-h b { display: block; font-size: 15.5px; }
.pscript .ph-h span { font-size: 12.5px; color: var(--muted); }
.prow { display: grid; grid-template-columns: 26px minmax(0, 1fr) 90px auto; gap: 12px; align-items: center; padding: 11px 20px; border: 0; background: none; width: 100%; text-align: left; }
.prow + .prow { border-top: 1px solid var(--line-2); }
.prow:hover { background: var(--surface-2); }
.prow .pn { font-size: 12px; font-weight: 700; color: var(--muted); text-align: center; }
.prow .pt { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ring { flex: none; }
.ring circle { fill: none; }
.ring .rb { stroke: var(--hover); }
.ring .rf { stroke: var(--teal); stroke-linecap: round; transition: stroke-dashoffset .4s; }
.ring text { fill: var(--ink); font-size: 11px; font-weight: 700; font-family: var(--font); }
.confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 14px 18px; border-radius: 16px; background: var(--red-soft); color: var(--red); font-weight: 600; font-size: 13.5px; }

/* ===== Lessons path ===== */
.tracks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.trk { border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 14px 16px; text-align: left; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.trk[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.trk .tt { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
.trk .tt .pdot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.trk .ts { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.upnext { position: relative; overflow: hidden; color: #fff; border-radius: 26px; padding: 26px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow-card); }
.upnext.fe { background: linear-gradient(135deg, var(--fe-a), var(--fe-b)); }
.upnext.mp { background: linear-gradient(135deg, var(--mp-a), var(--mp-b)); }
.upnext::after { content: ""; position: absolute; right: -70px; top: -80px; width: 260px; height: 260px; border-radius: 50%; border: 30px solid rgba(255,255,255,.08); pointer-events: none; }
.upnext .ue { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.upnext h2 { font-size: 28px; letter-spacing: -0.03em; line-height: 1.15; }
.upnext .um { font-size: 14px; opacity: .88; }
.upnext .bar { background: rgba(255,255,255,.22); margin-top: 4px; }
.upnext .bar i { background: #fff; }
.btn.white { background: #fff; color: #1c1c1e; height: 50px; padding: 0 26px; font-size: 15.5px; align-self: flex-start; margin-top: 6px; position: relative; z-index: 1; }
.btn.white:hover { background: #f2f2ef; }
.units { display: flex; flex-direction: column; gap: 14px; }
.unit { overflow: hidden; }
.unit-h { display: flex; align-items: center; gap: 14px; padding: 16px 18px; width: 100%; border: 0; background: none; text-align: left; }
.unit-h .ub { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font-weight: 700; font-size: 15px; background: var(--hover); color: var(--muted); flex: none; }
.unit-h .ub.cur { background: var(--teal-soft); color: var(--teal); }
.unit-h .ub.done { background: var(--green-soft); color: var(--green); }
.unit-h .ut { flex: 1; min-width: 0; }
.unit-h .ut b { display: block; font-size: 15.5px; }
.unit-h .ut span { font-size: 12.5px; color: var(--muted); }
.unit-h .uc { font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.unit-h .chev { color: var(--faint); transition: transform .2s; }
.unit-h[aria-expanded="true"] .chev { transform: rotate(90deg); }
.path { list-style: none; margin: 0; padding: 4px 0 10px; border-top: 1px solid var(--line-2); }
.path li { position: relative; }
.path li::before { content: ""; position: absolute; left: 35px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.path li:first-child::before { top: 50%; }
.path li:last-child::before { bottom: 50%; }
.path li.done::before { background: color-mix(in srgb, var(--green) 45%, var(--line)); }
.lrow { position: relative; display: flex; align-items: center; gap: 14px; width: 100%; border: 0; background: none; text-align: left; padding: 10px 18px; }
.lrow:hover:not([disabled]) { background: var(--surface-2); }
.lrow[disabled] { cursor: default; }
.node { position: relative; z-index: 1; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: none; background: var(--surface); border: 2px solid var(--line); color: var(--faint); }
.node svg { width: 16px; height: 16px; }
.lrow.done .node { background: var(--green); border-color: var(--green); color: #fff; }
.lrow.cur .node { background: var(--accent-fill); border-color: var(--accent-fill); color: #fff; box-shadow: 0 0 0 5px var(--teal-soft); }
.lrow .lt { flex: 1; min-width: 0; }
.lrow .lt b { display: block; font-weight: 600; font-size: 14.5px; }
.lrow.locked .lt b { color: var(--faint); font-weight: 500; }
.lrow .lt span { font-size: 12.5px; color: var(--muted); }
.lrow.locked .lt span { color: var(--faint); }
.lrow .go { font-size: 13px; font-weight: 700; color: #fff; background: var(--accent-fill); padding: 7px 14px; border-radius: 99px; white-space: nowrap; }
.lrow .again { font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }

/* ===== Lesson player ===== */
.focus .nav, .focus .tabbar { display: none; }
.focus .page { padding-top: 0; padding-bottom: 40px; }
.lesson { max-width: 720px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; min-height: 100%; }
.lbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; gap: 14px; padding: 16px 0 14px; background: var(--bg); }
.lbar .x { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--hover); color: var(--ink-2); display: grid; place-items: center; flex: none; }
.lbar .lp { flex: 1; height: 10px; border-radius: 99px; background: var(--hover); overflow: hidden; }
.lbar .lp i { display: block; height: 100%; border-radius: 99px; background: var(--accent-fill); transition: width .35s; }
.steps { display: flex; gap: 6px; }
.steps > * { font-size: 12px; font-weight: 600; color: var(--faint); padding: 4px 10px; border-radius: 99px; background: var(--hover); white-space: nowrap; border: 0; }
.steps > .on { color: var(--on-teal); background: var(--accent-fill); }
.steps > .ok { color: var(--green); background: var(--green-soft); }
.lhead { display: flex; flex-direction: column; gap: 6px; }
.lhead .le { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.lhead h1 { font-size: 30px; letter-spacing: -0.03em; line-height: 1.15; }
.lhead .ls { color: var(--muted); font-size: 14.5px; }
.howto { display: flex; gap: 10px; align-items: center; background: var(--teal-soft); color: var(--ink-2); border-radius: 14px; padding: 11px 14px; font-size: 14px; font-weight: 500; }
.howto svg { color: var(--teal); }
.ocard + .ocard { margin-top: 0; }
.ocard .oq { padding: 16px 22px 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.lfoot { position: sticky; bottom: 0; padding: 14px 0 calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); display: flex; gap: 10px; z-index: 20; }
.lfoot .btn { flex: 1; height: 54px; border-radius: 18px; font-size: 16px; }
.btn.soft-red { background: var(--red-soft); color: var(--red); }
.left { font-size: 13px; font-weight: 600; color: var(--muted); }
.feedback { border-radius: 16px; padding: 14px 16px; font-weight: 600; display: flex; gap: 10px; align-items: center; }
.feedback.good { background: var(--green-soft); color: var(--green); }
.feedback.bad { background: var(--red-soft); color: var(--red); }
.win { padding: 40px 26px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.win .big { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: var(--green); color: #fff; animation: pop .45s cubic-bezier(.2, 1.6, .4, 1) both; }
.win .big svg { width: 40px; height: 40px; stroke-width: 2.4; }
.win h2 { font-size: 28px; letter-spacing: -0.03em; }
.win .unl { display: inline-flex; align-items: center; gap: 8px; background: var(--teal-soft); color: var(--teal); font-weight: 600; padding: 8px 14px; border-radius: 99px; font-size: 14px; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ===== Role-play ===== */
.rp-setup { padding: 24px; display: flex; flex-direction: column; gap: 14px; }
.rp-step { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.rp-step b { font-size: 15.5px; }
.rp-n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--teal-soft); color: var(--teal); font-weight: 700; font-size: 13px; flex: none; }
.rp-types { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.rp-type { position: relative; border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px; text-align: left; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.rp-type b { font-size: 14.5px; }
.rp-type span { font-size: 12.5px; color: var(--muted); }
.rp-type em { font-style: normal; font-size: 11.5px; font-weight: 700; color: var(--green); margin-top: 4px; }
.rp-type[aria-pressed="true"] { border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal); background: var(--teal-soft); }
.rp-score { font-weight: 700; font-size: 15px; padding: 4px 10px; border-radius: 99px; }
.rp-score.hi, .rp-big.hi { color: var(--green); background: var(--green-soft); }
.rp-score.mid, .rp-big.mid { color: var(--amber); background: var(--amber-soft); }
.rp-score.lo, .rp-big.lo { color: var(--red); background: var(--red-soft); }
.rp-title { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.rp-title b { font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rp-title span { font-size: 12.5px; color: var(--muted); }
.rp-call { gap: 14px; }
.rp-sheet { overflow: hidden; }
.rp-sheet-h { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; text-align: left; padding: 12px 16px; }
.rp-sheet-h .rt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.rp-sheet-h .rt b { font-size: 14px; }
.rp-sheet-h .rt span { font-size: 12.5px; color: var(--muted); }
.rp-sheet-h .chev { color: var(--faint); transition: transform .2s; }
.rp-sheet-h[aria-expanded="true"] .chev { transform: rotate(90deg); }
.rp-sheet ul { margin: 0; padding: 4px 18px 14px 68px; display: flex; flex-direction: column; gap: 3px; font-size: 14px; color: var(--ink-2); }
.rp-log { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: min(560px, 86%); padding: 9px 14px; border-radius: 18px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg .who { margin-bottom: 1px; }
.msg.cust { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; color: var(--ink); }
.msg.cust.sp { background: var(--gold-soft); border-color: transparent; }
.msg.you { align-self: flex-end; background: var(--accent-fill); color: var(--on-teal); border-bottom-right-radius: 6px; }
.msg.you .who { color: rgba(255,255,255,.75); }
.sysline { text-align: center; font-size: 13px; color: var(--muted); padding: 6px 0; }
.rp-hint { padding: 14px 16px; border: 1px dashed var(--teal); background: var(--teal-soft); box-shadow: none; }
.rp-hint .say { font-size: 14.5px; margin-top: 4px; }
.composer { position: sticky; bottom: 0; z-index: 20; padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 75%, transparent); }
.composer .box { display: flex; gap: 8px; align-items: flex-end; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 6px 6px 6px 8px; box-shadow: var(--shadow-pop); }
.composer .box:focus-within { border-color: var(--teal); }
.composer textarea { flex: 1; min-width: 0; border: 0; background: none; resize: none; min-height: 44px; max-height: 160px; padding: 11px 8px; font-size: 15.5px; line-height: 1.45; }
.composer textarea:focus { outline: none; }
.mic, .sendb { width: 44px; height: 44px; border-radius: 50%; border: 0; display: grid; place-items: center; flex: none; }
.mic { background: var(--hover); color: var(--ink-2); }
.mic.on { background: var(--red); color: #fff; animation: ring 1.4s ease-out infinite; }
.sendb { background: var(--accent-fill); color: var(--on-teal); }
.sendb[disabled] { opacity: .4; cursor: default; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--red) 45%, transparent); } 100% { box-shadow: 0 0 0 14px transparent; } }
.rp-partial { font-size: 13.5px; color: var(--muted); padding: 6px 12px 0; font-style: italic; min-height: 1.4em; }
.rp-tools { display: flex; align-items: center; gap: 14px; padding: 6px 6px 0; font-size: 12.5px; }
.rp-tools .muted { margin-left: auto; }
.rp-tools .link svg { width: 16px; height: 16px; }
.rp-score-card { display: flex; align-items: center; gap: 18px; padding: 22px; }
.rp-big { width: 76px; height: 76px; border-radius: 22px; display: grid; place-items: center; font-size: 30px; font-weight: 700; letter-spacing: -0.03em; flex: none; }
.rp-score-card b { font-size: 16.5px; line-height: 1.4; display: block; }
.rp-list h3 { font-size: 16px; margin-bottom: 10px; }
.rp-list ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; color: var(--ink-2); }
.rp-fix { display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-top: 1px solid var(--line-2); }
.rp-fix:first-of-type { border-top: 0; padding-top: 0; }
.rp-fix p { color: var(--ink-2); }
.state.miss { background: var(--red-soft); color: var(--red); }
.rp-transcript summary { cursor: pointer; font-weight: 600; color: var(--teal); }
.rp-transcript .rp-log { margin-top: 14px; }
.list .row .rt span { white-space: normal; }

/* ===== Hands-free call ===== */
.hfwrap { position: sticky; bottom: 0; z-index: 20; padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 75%, transparent); display: flex; flex-direction: column; gap: 6px; }
.hfbar { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 12px 14px; box-shadow: var(--shadow-pop); }
.orb { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; flex: none; color: #fff; }
.orb svg { width: 24px; height: 24px; }
.orb.listen { background: var(--accent-fill); animation: listen 1.6s ease-out infinite; }
.orb.talk { background: linear-gradient(145deg, var(--fe-a), var(--fe-b)); animation: talk .9s ease-in-out infinite alternate; }
.orb.paused { background: var(--hover); color: var(--muted); }
@keyframes listen { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--teal) 45%, transparent); } 100% { box-shadow: 0 0 0 16px transparent; } }
@keyframes talk { from { transform: scale(.94); } to { transform: scale(1.05); } }
.hft { flex: 1; min-width: 0; }
.hft b { font-size: 15px; display: block; }
.cap { font-size: 13.5px; color: var(--muted); font-style: italic; min-height: 1.3em; overflow-wrap: anywhere; }
.cap.err { color: var(--red); font-style: normal; }
.vm { display: flex; flex-direction: column; gap: 14px; }
.vm-h { display: flex; gap: 14px; align-items: flex-start; }
.vm-h h3 { font-size: 18px; margin-bottom: 4px; }
.vm-steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 12px; color: var(--ink-2); }

function chunk(sid) {

async function initCaps() {
  if (!window.claude || typeof window.claude.use !== 'function') { CAP.loaded = true; if (UI.view === 'roleplay') render(true); return; }
  try {
    const [s, d, t] = await Promise.all([window.claude.use('sample'), window.claude.use('dictation'), window.claude.use('tts')]);
    CAP.sample = s; CAP.dict = d; CAP.tts = t;
    if (d) {
      d.onFinal(e => {
        if (HF.on) { hfHeardFinal(e.text); return; }
        const lesson = UI.view === 'lesson' && LES && LES.step === 'live';
        const ta = document.getElementById(lesson ? 'lt-input' : 'rp-input');
        const holder = lesson ? LES : RP;
        const cur = ta ? ta.value : holder.draft || '';
        holder.draft = cur ? cur + e.text : e.text.replace(/^\s+/, '');
        if (ta) { ta.value = holder.draft; ta.dispatchEvent(new Event('input')); }
      });
      d.onPartial(e => {
        if (HF.on) { hfHeardPartial(e.text); return; }
        VOICE.partial = e.text; const el = document.getElementById('rp-partial'); if (el) el.textContent = e.text;
      });
      d.onState(e => {
        const on = e.state !== 'idle';
        if (HF.on && e.state === 'idle' && e.reason && e.reason !== 'stopped') { HF.paused = true; clearTimeout(HF.timer); }
        if (e.state === 'idle' && (e.reason === 'not_granted' || e.reason === 'unavailable')) VOICE.err = e.reason === 'not_granted' ? 'The mic is off for this page. Turn it on in the page’s Permissions menu, or type instead.' : 'Talking isn’t available in this browser. Type instead.';
        if (on !== VOICE.listening) { VOICE.listening = on; if (UI.view === 'roleplay' || UI.view === 'lesson') render(true); }
      });
    }
    if (t) t.onState(e => { const sp = e.state === 'speaking' || e.state === 'starting'; if (sp !== VOICE.speaking) { VOICE.speaking = sp; if (UI.view === 'roleplay' && RP.screen === 'call') render(true); } });
  } catch (e) {}
  CAP.loaded = true;
  if (UI.view === 'roleplay') render(true);
}

const COPY = { state: null, text: '' };
function passCode(id) { let h = 7; for (const ch of id + '|usa-a') h = (h * 31 + ch.charCodeAt(0)) >>> 0; return String(1000 + (h % 9000)); }
const mdLine = x => plain(x.replace(/\{([^}]+)\}/g, '[$1]'));
function lessonVoicePrompt(l) {
  const items = l.type === 'reb'
    ? l.rebs.map(r => ({ cue: { who: r.situation ? 'branch' : 'obj', x: r.prompt }, ctx: r.ctx, ans: rebAnswer(r) })).filter(x => x.ans)

    const cue = c.who === 'cust' || c.who === 'obj' ? `CUSTOMER: "${mdLine(c.x)}"`
      : c.who === 'branch' ? `CUSTOMER: (act this out in one short line, then wait) ${mdLine(c.x)}${it.ctx ? ' (' + it.ctx + ')' : ''}`

  }).join('\n');
  const first = items[0] && (items[0].cue.who === 'cust' || items[0].cue.who === 'obj') ? 'say the first CUSTOMER line and wait.' : 'say only "Ready when you are." and wait for my first line.';

How it works:
- The lines of this part of the call are below, in order. CUSTOMER lines are yours. MY LINE is what I have to say, word for word.
- Say each CUSTOMER line exactly as written, then stop and wait for me. Where it says "Mm-hmm.", say just that and wait.
- Don't help me, don't say my lines, and don't comment until the end. Words in [brackets] are fill-ins I say with real details.
- After my last line, grade me. Compare what I said with MY LINES word for word. Start at 100 and take off points for each missing or changed word, for filler words like "um" and "uh", and for unsure words like "I think" or "maybe". Tell me my score out of 100 and my letter grade (A is 90 or more).
- If my score is 90 or more, tell me my pass code: ${passCode(l.id)}. If it's under 90, don't tell me the code. Tell me exactly which lines to fix, and offer to run it again from the top.

${rows}

Start now: ${first}`;
}

function render(keepScroll) {

  if (kbEl && HF.on && HF.kb && typeof document.createElement === 'function') {
    const tpl = document.createElement('div');

  const ae = document.activeElement, fid = ae && ae.id;

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { const say = e.target.closest('.covered .say'); if (say) say.classList.toggle('shown'); return; }
  if (el.disabled) return;
  const act = el.dataset.act, v = el.dataset.v;
  switch (act) {
    case 'nav': go(v); break;
    case 'track': UI.track = v; delete UI.open[v]; render(true); break;
    case 'unit': { const t = trackOf(UI.track), st = trackStats(t), cur = st.next ? st.next.unit.n : 0; const isOpen = UI.open[t.id] != null ? UI.open[t.id] === +v : +v === cur; UI.open[t.id] = isOpen ? 0 : +v; render(true); break; }

    case 'quitlesson':
      hfStop();
      if (CAP.dict && VOICE.listening) CAP.dict.stop().catch(() => {});
      SPEECH.stop();
      LES = null; go('home'); break;
    case 'lnext': toPractice(); lessonRender(); break;
    case 'lshow': LES.shown = true; render(true); break;
    case 'lgot': case 'lmiss': {
      const L = LES, it = L.queue.shift();
      grade(it.id, act === 'lgot' ? 2 : 0);
      if (act === 'lgot') L.got++; else L.queue.push(it);
      L.shown = false;
      if (!L.queue.length) toLive(); else if (L.l.type !== 'reb') speakCue(L.queue[0]);
      lessonRender(); break;
    }
    case 'lstart': if (hfCan()) liveStartHF(); else { Object.assign(LES, { hf: false, li: 0, res: [] }); speakCue(LES.items[0]); } lessonRender(); scrollEnd(); break;
    case 'lcall': toLive(); if (hfCan()) liveStartHF(); lessonRender(); scrollEnd(); break;
    case 'lstep': hfStop(); SPEECH.stop(); if (+v === 0) LES.step = 'learn'; else if (+v === 1) toPractice(); else toLive(); lessonRender(); break;
    case 'hfdone': if (HF.buf.trim()) hfFlush(); else if (UI.view === 'lesson' && !VOICE.speaking) { VAD.talking = false; VAD.turnT = 0; liveRead(); render(true); } break;
    case 'lread': clearTimeout(PACE.t); liveRead(); render(true); break;
    case 'lhear': if (BLOCKED.play) { BLOCKED.play(); render(true); } break;
    case 'lnow': if ((HF.src === 'tap' || HF.src === 'vad') && !VOICE.speaking) { clearTimeout(PACE.t); VAD.talking = false; VAD.turnT = 0; liveRead(); render(true); } break;
    case 'lend': clearTimeout(PACE.t); hfStop(); SPEECH.stop(); LES = null; go('home'); break;
    case 'lmicsw': {
      UI.callMic = !callMicOn(); saveUI();
      clearTimeout(PACE.t); PACE.li = -1;
      if (UI.callMic) { srStop(); HF.srFailed = false; hfStart(liveHeard, LES && LES.items[LES.li] && LES.items[LES.li].ans); }
      else { srStop(); VOICE.listening = false; HF.src = 'tap'; HF.kb = false; HF.buf = ''; }
      render(true); break;
    }
    case 'lpeek': LES.peek = !LES.peek; render(true); break;
    case 'hfresume': srStop(); hfStart(HF.onTurn, HF.expect); render(true); break;
    case 'vmcopy': copyText(v === 'lesson' ? lessonVoicePrompt(LES.l) : rpVoicePrompt()); break;
    case 'lunlock': {
      const el = document.getElementById('pc'), code = el ? String(el.value || '').trim() : '';
      if (code && code === passCode(LES.l.id)) { finishLesson(PASS); P.lessons[LES.l.id].via = 'voice'; save(); lessonRender(); }
      else { LES.codeErr = code ? 'That code doesn’t match. Get an A in voice mode and Claude will tell you yours.' : 'Enter the 4-digit code Claude gave you.'; render(true); }
      break;
    }
    case 'ltype': Object.assign(LES, { hf: false, typed: true, li: 0, res: [], draft: '' }); speakCue(LES.items[0]); lessonRender(); break;
    case 'rptyped': RP.screen = 'call'; RP.hf = false; render(); if (RP.voice) rpSpeak(RP.pickup); break;
    case 'lcheck': liveCheck().then(() => { render(true); if (LES && LES.step === 'live') { scrollEnd(); const ta = document.getElementById('lt-input'); if (ta && !CAP.dict) ta.focus(); } else window.scrollTo(0, 0); }); break;
    case 'lmic': micToggle(); break;
    case 'lsay': { const it = LES && LES.items[+v]; if (it) speakCue(it); break; }
    case 'lvoice': UI.lvoice = !UI.lvoice; saveUI(); render(true); break;
    case 'lback': hfStop(); toPractice(); lessonRender(); break;
    case 'lretake': { const typed = LES.typed; toLive(); if (hfCan() && !typed) liveStartHF(); else if (typed) { Object.assign(LES, { typed: true, li: 0 }); speakCue(LES.items[0]); } lessonRender(); break; }
    case 'lcoach': liveCoach(); break;
    case 'prod': UI.prod = v; UI.sec = 'all'; render(true); break;
    case 'lead': UI.lead[UI.prod] = v; { const l = leadObj(); if (!l.scripts.some(s => s.stage === UI.stage[UI.prod]) && l.scripts[0]) UI.stage[UI.prod] = l.scripts[0].stage; } UI.sec = 'all'; render(true); break;
    case 'stage': UI.stage[UI.prod] = v; UI.sec = 'all'; render(true); break;
    case 'sec': UI.sec = v; render(true); break;
    case 'cover': UI.cover = !UI.cover; render(true); break;
    case 'jump': { const t = document.getElementById('sec-' + v); if (t) t.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); break; }
    case 'drill': UI.prod = el.dataset.p; UI.lead[UI.prod] = el.dataset.l; UI.stage[UI.prod] = el.dataset.st; UI.sec = el.dataset.s; UI.pmode = 'cards'; SES = null; go('practice'); break;
    case 'pmode': UI.pmode = v; render(true); break;
    case 'order': UI.order = v; render(true); break;
    case 'quizmode': UI.quiz = v; render(true); break;
    case 'rebsrc': UI.reb = v; render(true); break;
    case 'restart': SES = null; render(true); break;
    case 'flip': if (SES) { SES.shown = true; render(true); } break;
    case 'grade': { const S = SES; if (!S) break; const it = S.items[S.i]; grade(it.id, +v); S.tally[+v]++; S.i++; S.shown = false; render(true); break; }
    case 'pick': { const S = SES; if (!S || S.picked !== null) break; S.picked = +v; const it = S.items[S.i]; const ok = S.opts[+v] === it.ans; grade(it.id, ok ? 2 : 0); S.tally[ok ? 2 : 0]++; render(true); break; }
    case 'check': { const S = SES; if (!S) break; const t = document.getElementById('typed'); S.typed = t ? t.value : S.typed; const it = S.items[S.i]; const r = lcsMark(it.ans, S.typed); S.checked = r; const q = r.score >= .85 ? 2 : r.score >= .6 ? 1 : 0; grade(it.id, q); S.tally[q]++; render(true); break; }
    case 'skip': { const S = SES; if (!S) break; const it = S.items[S.i]; S.checked = lcsMark(it.ans, ''); grade(it.id, 0); S.tally[0]++; render(true); break; }
    case 'next': { const S = SES; if (!S) break; S.i++; S.opts = null; S.picked = null; S.typed = ''; S.checked = null; S.shown = false; render(true); break; }
    case 'rpprod': UI.rpProd = v; UI.rpType = (RP_TYPES.find(t => t.prod === v) || RP_TYPES[0]).id; render(true); break;
    case 'rptype': UI.rpType = v; render(true); break;
    case 'rpmood': UI.rpMood = v; render(true); break;
    case 'rpvoice': UI.rpVoice = !UI.rpVoice; render(true); break;
    case 'rpstart': case 'rpnew': rpNewCall(false); break;
    case 'rpagain': rpNewCall(true); break;
    case 'rpsend': rpSend(); break;
    case 'rpmic': micToggle(); break;
    case 'rphint': { const cards = rpCards(); RP.hint = cards[Math.min(RP.pos, cards.length - 1)] || null; render(true); break; }
    case 'rpstopaudio': SPEECH.stop(); render(true); break;
    case 'rpsheet': RP.sheetOpen = !RP.sheetOpen; render(true); break;
    case 'rpend': rpGrade(); break;
    case 'rpregrade': rpGrade(); break;
    case 'rpretry': rpAsk(); break;
    case 'rpleave': if (RP.msgs && RP.msgs.some(m => m.who === 'you')) { RP.confirmLeave = true; render(true); } else { RP = { screen: 'setup' }; render(); } break;
    case 'rpleaveno': RP.confirmLeave = false; render(true); break;
    case 'rpleaveyes': case 'rpsetup':
      hfStop();
      if (CAP.dict && VOICE.listening) CAP.dict.stop().catch(() => {});
      SPEECH.stop();
      RP = { screen: 'setup' }; render(); window.scrollTo(0, 0); break;
    case 'lagain': startLesson(LES.l.id); break;
    case 'reset': confirmReset = true; render(true); break;
    case 'resetno': confirmReset = false; render(true); break;
    case 'resetyes': P = normP(null); confirmReset = false; SES = null; UI.open = {}; save(); if (sync.ref) flush(); render(true); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.target && /^(TEXTAREA|INPUT|SELECT)$/.test(e.target.tagName)) {
    if (e.target.id === 'rp-input' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); rpSend(); return; }
    if (e.target.id === 'kb-mic' && e.key === 'Enter') { e.preventDefault(); hfFlush(); return; }
    if (e.target.id === 'pc' && e.key === 'Enter') { e.preventDefault(); const b = document.querySelector('[data-act="lunlock"]'); if (b) b.click(); return; }
    if (e.target.id === 'lt-input' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); const b = document.querySelector('[data-act="lcheck"]'); if (b) b.click(); return; }
    if (e.target.id === 'typed' && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); const b = document.querySelector('[data-act="check"]'); if (b) b.click(); }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (UI.view === 'lesson') {
    if (k === ' ' || k === 'Enter') { const b = document.querySelector('[data-primary]'); if (b) { e.preventDefault(); b.click(); } }
    else if (k === 'Escape') { const b = document.querySelector('[data-act="quitlesson"]'); if (b) b.click(); }
    return;
  }
  if (UI.view !== 'practice' || !SES) return;
  if (k === ' ' || k === 'Enter') {
    const b = document.querySelector('[data-act="flip"]') || document.querySelector('[data-act="next"]');
    if (b) { e.preventDefault(); b.click(); }
  } else if (/^[1-4]$/.test(k)) {
    const b = document.querySelector(`[data-act="grade"][data-v="${+k - 1}"]`) || document.querySelector(`[data-act="pick"][data-v="${+k - 1}"]:not([disabled])`);
    if (b) { e.preventDefault(); b.click(); }
  }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (RENDER[h] && h !== UI.view && h !== 'lesson') { if (UI.view === 'lesson') LES = null; UI.view = h; render(); window.scrollTo(0, 0); } });

const h0 = location.hash.slice(1);
if (RENDER[h0] && h0 !== 'lesson') UI.view = h0;
render();
initSync();
initCaps();
setTimeout(prewarmAll, 300);
if (STANDALONE && typeof fetch === 'function') {
  fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).then(v => {
    if (!v || !v.build || v.build === BUILD) return;
    let done = '';
    try { done = sessionStorage.getItem('ss.upd') || ''; } catch (e) {}
    if (done === v.build) return;
    try { sessionStorage.setItem('ss.upd', v.build); } catch (e) {}
    location.replace(location.pathname + '?v=' + encodeURIComponent(v.build) + location.hash);
  }).catch(() => {});
}
if (typeof setInterval === 'function') setInterval(() => {
  const el = document.getElementById('call-timer');
  if (el && LES && LES.callStart) { const t = Math.floor((Date.now() - LES.callStart) / 1000); el.textContent = Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
}, 1000);
})();

}
</script>
<script>
(async function () {
  var app = document.getElementById('app');
  function locked(msg) { app.innerHTML = '<div class="card empty" style="margin-top:40px"><h3>Script Studio is locked</h3><p>' + (msg || 'Open it from your private link.') + '</p></div>'; }
  function b64u(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  var m = location.hash.match(/k=([A-Za-z0-9_-]+)/), k = m ? m[1] : null;
  try { if (k) localStorage.setItem('ss.k', k); else k = localStorage.getItem('ss.k'); } catch (e) {}
  if (!k || !window.crypto || !crypto.subtle) { locked(); return; }
  try {
    var key = await crypto.subtle.importKey('raw', b64u(k), { name: 'AES-CBC' }, false, ['decrypt']);
    var iv = new Uint8Array(ENC_IV.match(/../g).map(function (h) { return parseInt(h, 16); }));
    var ct = Uint8Array.from(atob(ENC), function (c) { return c.charCodeAt(0); });
    var pt = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: iv }, key, ct);
    DATA = JSON.parse(new TextDecoder().decode(pt));
    window.__ssKey = key;
  } catch (e) { locked('That link is missing part of its key. Open the full link again.'); return; }
  if (location.hash && !/^#(home|browse|practice|lesson)$/.test(location.hash)) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  __startApp();
})();
</script>
